backend:
  name: github
  repo: Reyansh14zzz/niharika-singh-associates
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blogs"
    label: "Blogs"
    folder: "content/blogs"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Featured Image"
        name: "image"
        widget: "image"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Author"
        name: "author"
        widget: "string"
        default: "Niharika Singh"

      - label: "Date"
        name: "date"
        widget: "datetime"

      - label: "Content"
        name: "body"
        widget: "markdown"